server {
  listen 80;
  
  location / {
    # Root path for static site content.
    root /usr/share/nginx/html;

    # SPA/Blazor routing:
    # - Serve a file if it exists.
    # - Otherwise fall back to index.html.
    try_files $uri $uri/ /index.html =404;
  }

  # Redirecting backend traffic
  location /api/ {
    # Keep the original /api/... request path when forwarding.
    # Expected env value: http://asbnapp-api:8080
    proxy_pass ${API_PROXY_PASS_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
