
# Reusable workflow to build the DataAPI project.
name: ASBNApp DataAPI Build

env:
  APP_LOCATION: './src/ASBNApp.DataAPI/' 
  DOTNET_VERSION: '10'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build AspNetCore web api

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.APP_LOCATION }}

      - name: Build
        run: dotnet build ${{ env.APP_LOCATION }} -c Release --no-restore