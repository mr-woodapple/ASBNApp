# On creating a new release, publish new container images for front and backend.

name: Publish Docker Images

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ 'main' ]
  # release:
  #   types: [published]

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: asbnapp-frontend
  BE_IMAGE_NAME: asbnapp-backend


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata here (release number and so on)

      - name: Build and Push Frontend image
        # id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ASBNApp.Frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FE_IMAGE_NAME }}:pr-${{ github.event.number }}
          labels: version xy

      # Add attestation

      - name: Build and Push DataAPI image
        # id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ASBNApp.DataAPI/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BE_IMAGE_NAME }}:pr-${{ github.event.number }}
          labels: testlabel

      # Add attestation
      