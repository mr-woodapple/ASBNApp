# On creating a new release, publish new container images for front and backend.

name: Publish Docker Images

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ 'chores/FixDockerSetup' ]
  # release:
  #   types: [published]

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: ASBNApp.Frontend
  BE_IMAGE_NAME: ABSNApp.DataApi


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata here (release number and so on)

      - name: Build and Push Frontend image
        # id: push
        uses: docker/build-push-action@v6
        with:
          context: ./src/ASBNApp.Frontend
          push: true
          tags: user/app:latest
          labels: version xy

      # Add attestation

      - name: Build and Push DataAPI image
        # id: push
        uses: docker/build-push-action@v6
        with:
          context: ./src/ASBNApp.DataAPI
          push: true
          tags: user/app:latest
          labels: testlabel

      # Add attestation
      